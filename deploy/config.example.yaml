# omnigen-ai 的 docker-compose 部署配置。
#
#   cp deploy/config.example.yaml deploy/config.yaml
#   # 填好下面四个必填项，然后 docker compose up -d
#
# 与 server/config.yaml.example 的差别只有两处，但都是致命的：
#   1. database.host 是 postgres（compose 服务名），不是 localhost —— 容器里的
#      localhost 指向容器自己，填 localhost 会连不上数据库。
#   2. database.password 必须与 compose 的 POSTGRES_PASSWORD 完全一致。
#
# 这个文件会以只读方式挂进 api 容器的 /app/config.yaml。它持有真实密钥，
# 记得加进 .gitignore（deploy/config.yaml 已加）。

# omnigen-ai 后端配置示例。
#
# 用法：
#   cp config.yaml.example config.yaml
#   # 编辑 config.yaml，至少填好 jwt.secret / app_encryption_key /
#   # bootstrap.admin_password 这三项（下面标了"必填"的）
#   make run
#
# config.yaml 已加入 .gitignore，不会被提交——它会持有真实密钥。这份
# .example 文件才是提交进仓库的版本，仅作为字段说明与默认值参考，不含任何
# 真实凭证。
#
# 配置只有这一份 YAML 文件，没有环境变量覆盖、没有 .env、没有 fallback
# 链。字段名手误（例如把 secret 写成 scret）会在启动时直接报错拒绝启动，
# 不会被静默忽略。

http:
  # 后端监听端口。
  port: 8080

database:
  host: postgres
  port: 5432
  user: postgres
  # 本地开发默认口令；生产环境务必替换。
  password: "在这里填写，必须与 compose 的 POSTGRES_PASSWORD 一致"
  name: omnigen
  # Postgres 的 sslmode，本地开发用 disable；生产环境视部署方式可能需要
  # require/verify-full。
  sslmode: disable

jwt:
  # 必填，至少 32 字节。生成：openssl rand -base64 32
  # 缺失或过短都会在启动时被拒绝——太短的密钥可被暴力破解，从而伪造任意
  # 用户的登录态。
  secret: ""
  # 登录态有效期，Go duration 格式（如 168h、2h30m）。
  ttl: 168h

# 必填，base64 编码的 32 字节。生成：openssl rand -base64 32
# 用于加密 app_settings 表里的上游 API Key（AES-256-GCM）。
# 轮换此密钥会导致已存储的上游凭证无法解密，需要清空 app_settings 表重新配置。
app_encryption_key: ""

bootstrap:
  admin_username: admin
  # 必填。仅在系统中不存在任何活跃管理员时使用，用于首次启动自举创建管理员
  # 账号；系统里已有活跃管理员时这一项会被忽略，不会覆盖已有账号。
  admin_password: ""

cors:
  # 允许跨域请求的前端 origin 列表。
  #
  # 填 "*" 表示放行全部来源。注意实现上并不会回字面量 `*`——那与
  # Access-Control-Allow-Credentials: true 在 CORS 规范里互斥，浏览器会拒绝
  # 整个响应；服务端改为把请求自带的 Origin 原样回显，效果相同但合法
  # （见 internal/router/router.go 的 hasWildcard）。
  #
  # 放行全部来源意味着任何网站的页面都能向本 API 发跨域请求。本系统用
  # Authorization: Bearer 而不是 Cookie，浏览器不会自动带上凭证，所以不存在
  # 传统 CSRF 那种"受害者一访问恶意站点就以其身份操作"的风险；但接口本身
  # 会对全网可见。同源部署（compose 里 nginx 同时托管前端与 /api 反代）
  # 根本不需要跨域，那种情况下留着白名单更稳妥。
  origins:
    - '*'
