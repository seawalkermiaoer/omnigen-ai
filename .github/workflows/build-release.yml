name: build & release

# 每次推 main 与每个版本 tag 都构建并推送两个镜像（api + web）；
# 打 tag 时额外用 tag message + 自动生成的提交摘要切一个 GitHub Release。
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  # 阿里云 ACR。服务器在国内，拉不动 Docker Hub / gcr.io，所以镜像发到这里。
  # 与用户另一个项目共用同一个 ACR 实例与命名空间。
  REGISTRY: crpi-2pvke2xiketaqi7e.cn-chengdu.personal.cr.aliyuncs.com
  NAMESPACE: ladr_xh

jobs:
  # ── 闸门：不让坏镜像出厂 ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # CI 里不起数据库，因此跳过 internal/repository —— 它是唯一连真实
      # Postgres 的包（db_test.go 的 testDSN / testhelper_test.go；全仓搜过
      # TEST_DB_URL、pgxpool、repository.NewPool 三个入口，只有这一个包命中，
      # 其余各层测试用的都是假实现）。
      #
      # 代价要清楚：被跳掉的不是边角料，而是
      #   - ConsumeQuota 的并发不超发测试（全项目唯一的并发正确性测试）
      #   - TestNewPool_SchemaIsMigrated（迁移真的应用过的守卫）
      #   - 全部 SQL 语句本身的正确性
      # 这些只能靠本地 `make test` 覆盖。要让 CI 也守住，就得把 postgres
      # service 加回来 —— 那是一个独立决定，不是这里顺手改一行的事。
      - name: Backend tests (skip DB-backed repository package)
        working-directory: server
        run: go test $(go list ./... | grep -v '/internal/repository$') -count=1

      - name: Backend vet
        working-directory: server
        run: go vet ./...

      # 与 web/Dockerfile 及开发机保持同一个 node 大版本。
      # npm ci 对锁文件是严格的：锁文件必须在 linux 上生成，否则会缺少
      # linux 专有的 wasm 回退依赖而直接失败（详见 web/Dockerfile 的注释）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 注意 lint 用的是 oxlint（package.json 里就是它），不是 eslint；
      # 仓库里没有 eslint 配置，`npx eslint` 会报找不到 config。
      #
      # 类型检查不单独跑 `tsc --noEmit`：根 tsconfig 是 files:[] + project
      # references，裸跑 tsc 什么都不检查就退出 0。真正的类型检查在
      # `npm run build`（它是 `tsc -b && vite build`）里。
      - name: Frontend lint + tests + build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  # ── 构建并推送 twwch/omnigen-ai:api-* 与 :web-* ────────────────────────
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # --- API 镜像（tags: api-latest, api-<sha>, api-v1.2.3）---
      - name: Metadata (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          # ACR 一个仓库一个镜像（与用户参考工作流里 account/imserver/csgate
          # 的用法一致），所以这里不再用 api-/web- 前缀区分，改成两个独立仓库。
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/omnigen-api
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & push (api)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # 服务器是 amd64。GitHub runner 目前也是 amd64，不写通常也对，
          # 但那是依赖 runner 的隐含属性——哪天换成 arm runner 就会静默产出
          # 拉下来跑不起来的镜像，显式钉死。
          platforms: linux/amd64
          # ACR 个人版对 OCI provenance/attestation 清单支持不完整，
          # 开着可能导致 push 成功但拉取时报 manifest 相关错误。
          provenance: false
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta_api.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # --- 前端镜像（tags: web-latest, web-<sha>, web-v1.2.3）---
      - name: Metadata (web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/omnigen-web
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & push (web)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          # 服务器是 amd64。GitHub runner 目前也是 amd64，不写通常也对，
          # 但那是依赖 runner 的隐含属性——哪天换成 arm runner 就会静默产出
          # 拉下来跑不起来的镜像，显式钉死。
          platforms: linux/amd64
          # ACR 个人版对 OCI provenance/attestation 清单支持不完整，
          # 开着可能导致 push 成功但拉取时报 manifest 相关错误。
          provenance: false
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── 打 tag 时：用 tag message + 自动摘要切一个 GitHub Release ───────────
  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract tag message
        id: tag
        run: |
          # actions/checkout 会把带注释的 tag 取成**轻量** tag（指向 commit
          # 本身，annotated tag 对象没被取下来）。此时
          # `git tag -l --format='%(contents)'` 会静默回退成那个 commit 的
          # message —— 发布说明里出现的是最后一条提交信息，而不是精心写的
          # tag 注释。这不是假设：v0.0.1 第一次发布就是这么翻车的，
          # Release 正文开头是「ci: GitHub Actions 构建发布流水线…」。
          #
          # 所以必须显式把 annotated tag 对象强制重新取一遍。--force 是必需的：
          # 同名的轻量 tag 已经在本地了，不覆盖就取不动。
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          # 取完再自检一次：确认它现在真的是 annotated tag（对象类型为 tag，
          # 轻量 tag 的类型是 commit）。宁可在这里显式失败，也好过又发一版
          # 正文是提交信息的 Release —— 那种错误发出去才会被发现。
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} 不是 annotated tag，发布说明会退化成提交信息。请用 git tag -a 重新打标签。"
            exit 1
          fi

          {
            echo 'body<<__OMNIGEN_EOF__'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo '__OMNIGEN_EOF__'
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag.outputs.body }}
          generate_release_notes: true
