server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 单页应用：任何前端路由（/imggen、/history…）刷新时都会真的打到 nginx，
    # 磁盘上并没有对应文件，必须回退到 index.html 交给 react-router 处理，
    # 否则刷新任意子页面都是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可以长期强缓存；index.html 绝对不行——它是那些
    # 哈希文件名的唯一入口，被缓存住的话新版本上线后用户仍会加载旧 chunk。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 反代到后端。生产同源部署，因此后端不需要配 CORS。
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成类接口是同步的且很慢：实测 optimize-prompt 约 19s、
        # gpt-image-2 出图约 40s，后端对上游的超时是 180s。nginx 默认的
        # proxy_read_timeout 只有 60s，不改的话它会先于后端掐断连接，
        # 用户看到 504，而后端仍在跑完并计费。
        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        # 上传参考图要走这里，别被默认的 1m 卡住。
        client_max_body_size 60m;
    }
}
