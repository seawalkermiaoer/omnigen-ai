<!--
  OmniGen AI 的 favicon —— 与应用内的品牌标记（src/components/BrandMark.tsx）
  必须是同一个造型：三段圆弧构成的光圈 + 中心点。

  几何参数是从 BrandMark 那边照搬过来的，不是重新调的：
    半径 6.25、线宽 2.25、dasharray 6.84/6.25、旋转 -121.35。
  其中 dasharray 的 6.25 是 VISUAL_GAP(4) + STROKE(2.25)：strokeLinecap="round"
  会让每段弧两端各多伸出线宽的一半，不补回去的话缺口只剩 1.75 单位，
  在 16px 的标签页图标里会被抗锯齿抹平成一个闭合圆环。favicon 是全系统显示
  尺寸最小的地方，这个补偿在这里比在侧栏更要命。

  改动时请与 BrandMark.tsx 同步，两处长得不一样会让人以为开错了标签页。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="28" height="28" rx="8.5" fill="url(#m)"/>
  <circle cx="14" cy="14" r="6.25" fill="none" stroke="#fff" stroke-width="2.25"
          stroke-linecap="round" stroke-dasharray="6.84 6.25"
          transform="rotate(-121.35 14 14)"/>
  <circle cx="14" cy="14" r="2.4" fill="#fff"/>
</svg>
